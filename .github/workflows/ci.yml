name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests (offline, no API keys)
        run: pytest -q

      - name: Import smoke check
        env:
          GROQ_API_KEY: dummy-key-for-import-check
          CEREBRAS_API_KEY: dummy-key-for-import-check
        run: python -c "import main, ingestion, retrieval, critique, scoring, storage, llm_client"
